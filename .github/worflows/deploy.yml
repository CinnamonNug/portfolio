name: Deploy SolidJS (pnpm) to GitHub Pages

on:
  push:
    branches: ["master"] # Change to "master" if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SolidJS project
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload dist folder artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # SolidJS / Vite outputs build to dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4