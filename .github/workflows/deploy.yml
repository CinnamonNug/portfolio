name: Deploy SolidStart to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SolidStart project
        run: pnpm run build

      - name: Add .nojekyll file
        run: touch .output/public/.nojekyll # Prevents GitHub from ignoring files starting with underscores

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.output/public' # SolidStart/Nitro outputs static files here by default

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
